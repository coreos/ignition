# Maintained in https://github.com/coreos/repo-templates
# Do not edit downstream.

name: Release notes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: release-note-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-notes:
    name: Require release note
    runs-on: ubuntu-latest
    steps:
      - name: Require release note
        uses: coreos/actions-lib/require-file-change@main
        with:
          path-regex: '^docs/release-notes\.d/[a-z0-9]+(-[a-z0-9]+)*\.(breaking|feature|change|bugfix)\.md$'
          status: added
          override-label: skip-notes
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate release-note fragments
        run: go run ./internal/util/tools/release-notes validate
